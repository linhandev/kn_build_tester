kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental.native=true
kotlin.native.cacheOrchestration=compiler

# With incremental compilation + compiler cache orchestration:
# - Each source file gets a per-file static cache .a file
# - The linker receives ALL of them as individual command-line args
# - On Linux, GccBasedLinker passes them raw (no @file response file)
# - Exceeds ARG_MAX (2MB), fails with E2BIG ("Argument list too long")
