#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4g"
#Kotlin
kotlin.code.style=official
kotlin.build.disable.gradle.version.check=true
kotlin.version.non-ios=2.0.20-bytekmp-1001
kotlin.version.ios=2.1.21
ksp.version.non-ios=2.0.20-1.0.24
ksp.version.ios=2.1.21-2.0.1
bytekmp.disable.kotlin.version.check=true
#Compose
compose.common.ios.version=1.6.10-bytekmp.ios.2
compose.resource.ios.version=1.6.10-bytekmp.ios.2
compose.lifecycle.ios.version=2.8.0-bytekmp.ios.2
compose.navigation.ios.version=2.7.7-bytekmp.ios.2
compose.common.non-ios.version=1.6.10-bytekmp.10
compose.resource.non-ios.version=1.6.10-bytekmp.10
compose.lifecycle.non-ios.version=2.8.0-bytekmp.10
compose.navigation.non-ios.version=2.7.7-bytekmp.10
#Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
kotlin.native.cocoapods.generate.wrapper=true
kotlin.native.useEmbeddableCompilerJar=true
# Enable kotlin/native experimental memory model
kotlin.native.binary.memoryModel=experimental
kotlin.js.ir.output.granularity=whole-program
# Enable build cache
org.gradle.caching=true
# Enable kotlin native incremental build
kotlin.incremental.native=true
kotlin.mpp.enableResourcesPublication=true
kotlin.native.binary.latin1Strings=true
kcp.enabled=true