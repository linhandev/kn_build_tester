# Disable the default Kotlin hierarchy template to avoid target name conflicts
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Enable Gradle configuration cache for better performance
org.gradle.configuration-cache=true

# Enable parallel builds
org.gradle.parallel=true

# Use Gradle daemon for faster builds
org.gradle.daemon=true

# Increase heap space for Kotlin/Native compilation
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=512m
