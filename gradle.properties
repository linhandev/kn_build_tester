# Upstream JetBrains Kotlin 2.4.0
# Static caches (NativeCacheKind.STATIC) are the default for linuxX64/macosArm64.
# Each source file produces a separate cache .a file.
# With enough source files, the linker command line exceeds ARG_MAX (E2BIG)
# on Linux because GccBasedLinker lacks @file response file support.
