# Gradle properties for KMP build efficiency testing
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Enable Gradle configuration cache for performance
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# JVM heap size for large builds
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

# Kotlin compiler options
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.native.cacheKind=static

# Android specific
android.useAndroidX=true
android.enableJetifier=true

# Build performance tracking
kotlin.native.binary.memoryModel=experimental
kotlin.native.binary.freezing=disabled

# Project scale configuration (adjustable)
project.scale.classes=100
project.scale.functions=50
project.scale.protobuf.messages=20