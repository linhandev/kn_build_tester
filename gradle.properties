kotlin.code.style=official

# Upstream JetBrains Kotlin 2.4.0
kotlinVersion=2.4.0

# Static caches are the default for KN executables.
# Each source file produces a separate cache .a file.
# With enough files, the linker command line exceeds ARG_MAX (E2BIG).
#
# To reproduce the bug on Linux (GccBasedLinker has no @file response file support):
#   ./gradlew linkDebugExecutableLinuxX64
#
# To verify the build passes on macOS (MacOSBasedLinker already uses -filelist):
#   ./gradlew linkDebugExecutableMacosArm64
#
# To suppress the bug (no static caches → fewer .a files):
#   kotlin.native.cacheKind=none
#   kotlin.native.cacheKind.linuxX64=none
